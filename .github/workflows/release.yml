name: Create Release
run-name: Release ${{ inputs.version }} (${{ inputs.channel }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release marks latest; prerelease is marked on GitHub only (same source ZIP)"
        required: true
        type: choice
        default: release
        options:
          - release
          - prerelease
      version:
        description: "Only X.Y.Z (e.g. 0.4.0); release label, does not change version.rb"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]

    steps:
      - name: Check out the selected immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false

      - name: Install the standalone test dependency
        run: gem install minitest --version 5.25.5 --no-document

      - name: Check Ruby syntax
        run: git ls-files -z -- '*.rb' | xargs -0 -r -n 1 ruby -c

      - name: Run standalone DMSF tools tests
        run: ruby -Itest/standalone test/standalone/dmsf_tools_test.rb

      - name: Run standalone document action tests
        run: ruby -Itest/standalone test/standalone/document_action_test.rb

      - name: Test release packaging and publication guards
        if: matrix.ruby == '3.2'
        run: python3 -m unittest discover -s test/release -p 'test_*.py' -v

  build:
    name: Validate and package
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      channel: ${{ steps.request.outputs.channel }}
      commit: ${{ steps.request.outputs.commit }}
      artifact_id: ${{ steps.package.outputs.artifact-id }}

    steps:
      - name: Check out the selected immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate requested version, channel, and source commit
        id: request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from scripts.build_release import STABLE_VERSION

          requested = os.environ["RELEASE_VERSION"]
          if not STABLE_VERSION.fullmatch(requested):
              raise SystemExit("Release version must be numeric X.Y.Z without v or suffix")
          channel = os.environ["RELEASE_CHANNEL"]
          if channel not in {"release", "prerelease"}:
              raise SystemExit("Release channel must be release or prerelease")
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("Checkout does not match the selected workflow revision")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={requested}", file=output)
              print(f"tag=v{requested}", file=output)
              print(f"channel={channel}", file=output)
              print(f"commit={commit}", file=output)
          PY

      - name: Build installable plugin packages from the selected commit
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: python3 scripts/build_release.py --output-dir dist --version "$RELEASE_VERSION"

      - name: Verify release manifest, provenance, and checksums
        env:
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          SOURCE_COMMIT: ${{ steps.request.outputs.commit }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from scripts.publish_release import load_manifest

          plan = load_manifest(Path("dist"), os.environ["SOURCE_COMMIT"], os.environ["GITHUB_SHA"])
          if plan.version != os.environ["RELEASE_VERSION"]:
              raise SystemExit("Verified package version differs from the requested release")
          PY
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Preserve verified release files
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/redmine_ai_helper_extension_dmfs-*.zip
            dist/redmine_ai_helper_extension_dmfs-*.tar.gz
            dist/SHA256SUMS
            dist/release-notes.md
            dist/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish ${{ needs.build.outputs.tag }} (${{ needs.build.outputs.channel }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: plugin-publication-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out the verified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download the verified release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
          digest-mismatch: error

      - name: Publish the checked release without overwriting existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 scripts/publish_release.py --directory dist --channel "$RELEASE_CHANNEL"
